name: Build PicPay Demo APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas e instalar Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar e extrair projeto
        run: |
          test -f PicPayDemo-Projeto-Android.zip
          mkdir -p extracted
          unzip -o PicPayDemo-Projeto-Android.zip -d extracted
          test -f extracted/PicPayDemo/app/build.gradle.kts
          echo "Projeto encontrado."

      - name: Compilar APK de depuracao
        run: |
          cd extracted/PicPayDemo
          gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PicPayDemo-APK
          path: extracted/PicPayDemo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
